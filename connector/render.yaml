services:
  - type: web
    name: quelltest-connector
    runtime: docker
    dockerfilePath: connector/Dockerfile
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CONNECTOR_URL
        value: https://mcp.quelltest.com
      - key: QUELLTEST_API_URL
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
